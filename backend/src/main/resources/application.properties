spring.application.name=${SPRING_APPLICATION_NAME:backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}
logging.level.com.nexobank=${LOG_LEVEL_NEXOBANK:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.jwt.issuer=${JWT_ISSUER:nexobank}
app.security.jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-bytes}
app.security.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.security.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
app.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
app.security.auth-rate-limit.requests=${AUTH_RATE_LIMIT_REQUESTS:10}
app.security.auth-rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}
info.app.name=NexoBank API
info.app.description=Core banking demonstration API
