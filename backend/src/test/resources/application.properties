spring.datasource.url=jdbc:h2:mem:nexobank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.security.jwt.secret=phase-13-test-secret-that-is-at-least-thirty-two-bytes
app.security.jwt.access-token-expiration-seconds=900
app.security.jwt.refresh-token-expiration-seconds=604800
